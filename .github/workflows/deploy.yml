name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sent by the Google Apps Script in scripts/google-apps-script when the sheet changes.
  repository_dispatch:
    types: [sheet-updated]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
