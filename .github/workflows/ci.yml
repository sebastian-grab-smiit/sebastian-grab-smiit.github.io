name: CI

# Runs on every pull request and is reused by the deploy workflow, so the exact
# artifact that passed all checks is the one that gets deployed.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

jobs:
  quality:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build:
    name: Validate sheet and build
    needs: quality
    runs-on: ubuntu-latest
    # Repository secrets: see README → "Configuration".
    env:
      NEXT_PUBLIC_CALENDLY_URL: ${{ secrets.NEXT_PUBLIC_CALENDLY_URL }}
      NEXT_PUBLIC_GOOGLE_SHEET_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_SHEET_ID }}
      NEXT_PUBLIC_GOOGLE_SHEET_PERSONAL_GID: ${{ secrets.NEXT_PUBLIC_GOOGLE_SHEET_PERSONAL_GID }}
      NEXT_PUBLIC_GOOGLE_SHEET_CERTIFICATES_GID: ${{ secrets.NEXT_PUBLIC_GOOGLE_SHEET_CERTIFICATES_GID }}
      NEXT_PUBLIC_GOOGLE_SHEET_LANGUAGES_GID: ${{ secrets.NEXT_PUBLIC_GOOGLE_SHEET_LANGUAGES_GID }}
      NEXT_PUBLIC_GOOGLE_SHEET_ACADEMICS_GID: ${{ secrets.NEXT_PUBLIC_GOOGLE_SHEET_ACADEMICS_GID }}
      NEXT_PUBLIC_GOOGLE_SHEET_SKILLS_GID: ${{ secrets.NEXT_PUBLIC_GOOGLE_SHEET_SKILLS_GID }}
      NEXT_PUBLIC_GOOGLE_SHEET_RESUME_GID: ${{ secrets.NEXT_PUBLIC_GOOGLE_SHEET_RESUME_GID }}
      NEXT_PUBLIC_GOOGLE_SHEET_PROJECTS_GID: ${{ secrets.NEXT_PUBLIC_GOOGLE_SHEET_PROJECTS_GID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate sheet data
        run: npm run check:sheet
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  e2e:
    name: E2E and accessibility
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
